spring.application.name=aura

server.port=8080

# Replace with your actual MySQL database name, username, and password
spring.datasource.url=jdbc:mysql://localhost:3306/aura?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Do not keep a database session open while the response is rendered (services map entities to DTOs themselves)
spring.jpa.open-in-view=false

# Frontend origins allowed to call the API (comma-separated)
aura.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
